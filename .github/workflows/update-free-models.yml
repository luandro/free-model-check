name: Update free model ranking

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Build free model report
        id: build
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          set +e
          python free_model_filter.py --include-unscored 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE "HTTP 429|Rate limit exceeded" /tmp/build.log; then
            echo "::warning::Artificial Analysis rate limit reached; keeping the previous Pages deployment."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      - name: Prepare Pages site
        if: steps.build.outputs.produced != 'false'
        run: |
          mkdir -p _site/data
          cp free_models.json _site/data/free_models.json
          cp free_models_stealthmark.json _site/data/free_models_stealthmark.json
          cp free_models_unbenchmarked.json _site/data/free_models_unbenchmarked.json
          cp -R site/. _site/

      - name: Configure Pages
        if: steps.build.outputs.produced != 'false'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.build.outputs.produced != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.produced != 'false'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report skipped deployment
        if: steps.build.outputs.produced == 'false'
        run: echo "No new report was produced; the existing Pages site is still live."